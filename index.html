<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Arithmetic Operator -->
    <b>
        <p>Use of Arithmetic Operator</p>
    </b>
    <p>1:Addition Operator</p>
    <script>
        const a = 10;
        const b = 20;
        const result = a + b;
        document.write("Addition Operator:");
        document.write(result);
    </script>

    <p>2:Subtraction Operator</p>
    <script>
        let c = 30;
        let d = 10;
        const result1 = c - d;
        document.write("Subtraction Operator:");
        document.write(result1)
    </script>

    <p>3:Multiplication Operator</p>
    <script>
        const e = 30;
        const f = 10;
        const result2 = e * f;
        document.write("Multiplication Operator:");
        document.write(result2)
    </script>

    <p>4:Division Operator</p>
    <script>
        const g = 30;
        const h = 10;
        const result3 = g / h;
        document.write("Division Operator:");
        document.write(result3)
    </script>

    <!-- increment & decrement operator -->
    <script>
        console.log("Use of Increment Operator")
        let num = 21;
        let results = num++;
        console.log("Post-Increment ( num++ ):")
        console.log(results);
        console.log(num);

        num = 23;
        results = ++num;
        console.log("Pre-Increment ( ++num ):")
        console.log(results);
        console.log(num);

        console.log("Use of Decrement Operator")
        num = 25;
        results = num--;
        console.log("Post-Decrement ( num-- ):")
        console.log(results);
        console.log(num);

        num = 27;
        results = --num;
        console.log("Pre-Decrement ( --num ):")
        console.log(results);
        console.log(num); 
    </script>

    <!-- Comparision Operator -->
    <b>
        <p>Comparision Operator</p>
    </b>
    <script>
        let num1 = 10;
        let num2 = 20;
        document.write("Equal To Operator: ", num1 == num2);
    </script>
    <br>
    <script>
        num1 = 20;
        num2 = 20;
        document.write("Strict equal to Operator: ", num1 === num2);
    </script>
    <br>
    <script>
        num1 = 30;
        num2 = 20;
        document.write("Not equal to Operator: ", num1 != num2);
    </script>
    <br>
    <script>
        num1 = 10;
        num2 = 20;
        document.write("less than Operator: ", num1 < num2);
    </script>
    <br>
    <script>
        num1 = 50;
        num2 = 20;
        document.write("Greater than Operator: ", num1 > num2);
    </script>
    <br>
    <script>
        num1 = 80;
        num2 = 20;
        document.write("less than equal to Operator: ", num1 <= num2);
    </script>
    <br>
    <script>
        num1 = 80;
        num2 = 20;
        document.write("greater than equal to Operator: ", num1 >= num2);
    </script>

    <!-- Logical Operator -->
    <b>
        <p>Logical Operator</p>
    </b>
    <script>
        let res = 5 > 3 && 4 > 2;
        document.write("AND Operator: ", res);
    </script>
    <br>
    <script>
        res = 5 === 5 || 4 === 2;
        document.write("OR operator: ", res);
    </script>
</body>

</html>
