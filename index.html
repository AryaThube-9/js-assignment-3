<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Arithmetic Operator -->
    <b>
        <p>Use of Arithmetic Operator</p>
    </b>
    <p>1:Addition Operator</p>
    <script>
        const a = 10;
        const b = 20;
        const result = a + b;
        document.write("Addition Operator:");
        document.write(result);
    </script>

    <p>2:Subtraction Operator</p>
    <script>
        let c = 30;
        let d = 10;
        const result1 = c - d;
        document.write("Subtraction Operator:");
        document.write(result1)
    </script>

    <p>3:Multiplication Operator</p>
    <script>
        const e = 30;
        const f = 10;
        const result2 = e * f;
        document.write("Multiplication Operator:");
        document.write(result2)
    </script>

    <p>4:Division Operator</p>
    <script>
        const g = 30;
        const h = 10;
        const result3 = g / h;
        document.write("Division Operator:");
        document.write(result3)
    </script>
</body>

</html>
